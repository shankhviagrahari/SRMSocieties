<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SRM Societies</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/categories}">SRM Societies</a><span class="who"><span th:if="${session.admin}" class="badge">ADMIN</span> Hi, <b th:text="${session.name}"></b> &middot; <a th:href="@{/logout}">Logout</a></span></header><main>
<a class="back" th:href="@{/club(id=${club.id})}">&larr; <span th:text="${club.name}"></span></a>
<h1 th:text="${team.name}"></h1>
<p class="intro" th:text="${team.intro}"></p>
<div class="admin" th:if="${session.admin}">
<a class="btn" th:href="@{/admin/team/edit(id=${team.id})}">Edit team</a>
<form th:action="@{/admin/team/delete}" method="post" onsubmit="return confirm('Delete this team?')"><input type="hidden" name="id" th:value="${team.id}"><button class="btn danger">Delete team</button></form>
</div>
<div class="panel"><h3>Current heads</h3><p th:text="${team.heads}"></p></div>
<div class="panel"><h3>When to apply / openings</h3><p th:text="${team.applyInfo}"></p></div>
</main></body></html>
